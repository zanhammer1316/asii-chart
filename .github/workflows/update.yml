name: Update ASII data

on:
  schedule:
    - cron: "30 10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_asii.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/asii.json
          git commit -m "Update ASII prices" || echo "No changes"
          git push
